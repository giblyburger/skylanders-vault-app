name: Build downloadable iPad IPA

on:
  push:
    branches: [main]
    tags: ['ios-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned iOS app
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle the complete Vault into iOS
        run: pnpm run ios:sync

      - name: Build without Apple code signing
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=''

      - name: Package IPA
        run: |
          set -euo pipefail
          app_path="$(find build/ios/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$app_path"
          mkdir -p package/Payload release
          ditto "$app_path" "package/Payload/Skylanders Vault.app"
          (
            cd package
            ditto -c -k --sequesterRsrc --keepParent Payload ../release/Skylanders-Vault-unsigned.ipa
          )
          shasum -a 256 release/Skylanders-Vault-unsigned.ipa > release/Skylanders-Vault-unsigned.ipa.sha256
          test -s release/Skylanders-Vault-unsigned.ipa

      - name: Upload downloadable IPA
        uses: actions/upload-artifact@v4
        with:
          name: Skylanders-Vault-unsigned
          path: |
            release/Skylanders-Vault-unsigned.ipa
            release/Skylanders-Vault-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/ios-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/Skylanders-Vault-unsigned.ipa \
            release/Skylanders-Vault-unsigned.ipa.sha256 \
            --verify-tag \
            --title "Skylanders Vault for iPad — $GITHUB_REF_NAME" \
            --notes "Unsigned offline-first IPA for jailbroken iPads running iOS 13 or newer. The complete 640-card artwork library is bundled inside; cloud sync and personal-photo backup connect when online."
